server:
  port: ${PORT:8083}

spring:
  application:
    name: pedido
  data:
    mongodb:
      auto-index-creation: true
      # Segredos (MONGO_URI, RABBITMQ_URI, JWT_SECRET) vêm de variáveis de ambiente, nunca do código
      uri: ${MONGO_URI}
  rabbitmq:
    addresses: ${RABBITMQ_URI}
    listener:
      simple:
        # Se o processamento falhar, tenta 3 vezes e depois manda para a fila morta (.dlq)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0

jwt:
  secret: ${JWT_SECRET}
